spring.application.name=gridflex-backend-service

spring.datasource.url=jdbc:postgresql://${PROD_DB_HOST}:${PROD_DB_PORT}/${PROD_DB_NAME}?ApplicationName=portal-onboard-service
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
#logging.level.org.postgresql=DEBUG

spring.data.mongodb.uri=mongodb://${PROD_MONGO_USERNAME}:${PROD_MONGO_PASSWORD}@${PROD_MONGO_HOST}:${PROD_MONGO_PORT}/${PROD_MONGO_DB}?authSource=${PROD_MONGO_USERNAME}

#springdoc.api-docs.enabled=false
#springdoc.swagger-ui.enabled=false

# Eureka settings
eureka.client.service-url.defaultZone=http://${EUREKA_ADDRESS}:${EUREKA_PORT}/eureka/
eureka.client.service-url.instance.prefer-ip-address=true                # Register using IP instead of hostname
eureka.client.service-url.ip-address=${spring.cloud.client.ip-address}  # Auto-detects service IP
eureka.client.service-url.instance-id=${spring.application.name}:${server.port}
eureka.client.service-url.metadata-map.management.port=${management.server.port:${server.port}}

# Flyway settings
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.table=flyway_schema_history_gridflex_service

file.upload-dir=${WIN_LOCATION}/uploads
file.base-address = https://${WIN_DOMAIN}

external.token-gen.base-url=http://${WIN_T_ADDRESS}:${T_PORT}
external.hes-endpoint.base-url=http://${HES_ADDRESS}:${HES_PORT}/api
external.hes-realtime.base-url=http://${HES_ADDRESS}:${HES_PORT}/api/realtime
external.dlms-write-ops.base-url=http://${HES_ADDRESS}:${HES_PORT}/api/dlms

logging.level.org.springframework.cloud.gateway=DEBUG
logging.file.name=${WIN_LOCATION}/logs/gridflex.log
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history: 1
logging.logback.rollingpolicy.total-size-cap: 100MB
logging.logback.rollingpolicy.file-name-pattern: /${WIN_LOCATION}/logs/gridflex.%d{yyyy-MM-dd}.%i.log

gridflex.data.dir=${WIN_LOCATION}/data