name: Deploy Spring Boot to Server

on:
  push:
    branches:
      - staging
      - main
      - alfuttaim
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gridflex-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-linux:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # CHECKOUT
      # =====================================================
      - name: Checkout code
        uses: actions/checkout@v4

      # =====================================================
      # JAVA SETUP
      # =====================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # =====================================================
      # BUILD
      # =====================================================
      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw package -DskipTests

      # =====================================================
      # RESOLVE JAR
      # =====================================================
      - name: Resolve JAR
        shell: bash
        run: |
          set -euo pipefail

          JAR_FILE=$(find target -maxdepth 1 -type f \
            -name "*.jar" \
            ! -name "*original*.jar" \
            ! -name "*sources.jar" \
            ! -name "*javadoc.jar" \
            | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "::error::No application JAR found in target/"
            exit 1
          fi

          echo "JAR_FILE=$JAR_FILE" >> "$GITHUB_ENV"
          echo "Found: $JAR_FILE"

      # =====================================================
      # SSH SETUP - STAGING
      # =====================================================
      - name: Setup SSH (Staging)
        if: github.ref == 'refs/heads/staging'
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      # =====================================================
      # SSH SETUP - PRODUCTION
      # =====================================================
      - name: Setup SSH (Production)
        if: github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      # =====================================================
      # DEPLOY STAGING OR PRODUCTION
      # =====================================================
      - name: Deploy Gridflex
        shell: bash
        env:
          SERVER_USER: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_SERVER_USER || secrets.PROD_SERVER_USER }}
          SERVER_HOST: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_SERVER_HOST || secrets.PROD_SERVER_HOST }}
          SSH_PORT: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_SERVER_SSH_PORT || secrets.PROD_SERVER_SSH_PORT || '22' }}
          LOCATION: ${{ secrets.LOCATION }}

          DB_HOST: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_DB_HOST || secrets.PROD_DB_HOST }}
          DB_PORT: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_DB_PORT || secrets.PROD_DB_PORT }}
          DB_NAME: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_DB_NAME || secrets.PROD_DB_NAME }}
          DB_USERNAME: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_DB_USERNAME || secrets.PROD_DB_USERNAME }}
          DB_PASSWORD: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_DB_PASSWORD || secrets.PROD_DB_PASSWORD }}

          MONGO_HOST: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_MONGO_HOST || secrets.PROD_MONGO_HOST }}
          MONGO_PORT: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_MONGO_PORT || secrets.PROD_MONGO_PORT }}
          MONGO_DB: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_MONGO_DB || secrets.PROD_MONGO_DB }}
          MONGO_USERNAME: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_MONGO_USERNAME || secrets.PROD_MONGO_USERNAME }}
          MONGO_PASSWORD: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_MONGO_PASSWORD || secrets.PROD_MONGO_PASSWORD }}

          HES_PORT: ${{ secrets.HES_PORT }}
          HES_ADDRESS: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_HES_ADDRESS || secrets.PROD_HES_ADDRESS }}
          T_ADDRESS: ${{ secrets.T_ADDRESS }}
          T_PORT: ${{ secrets.T_PORT }}

          ADMIN_API_VALUE: ${{ secrets.ADMIN_API_VALUE }}
          USER_API_VALUE: ${{ secrets.USER_API_VALUE }}
          SETUP_API_VALUE: ${{ secrets.SETUP_API_VALUE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          HEADER_KEY: ${{ secrets.HEADER_KEY }}

          EUREKA_ADDRESS: ${{ secrets.EUREKA_ADDRESS }}
          EUREKA_PORT: ${{ secrets.EUREKA_PORT }}
          BASE_ADDRESS: ${{ secrets.BASE_ADDRESS }}
          DOC_ADDRESS: ${{ secrets.DOC_ADDRESS }}

          STAGING_DOMAIN: ${{ secrets.STAGING_DOMAIN }}
          PROD_DOMAIN: ${{ secrets.PROD_DOMAIN }}

        run: |
          set -euo pipefail

          APP_PROFILE="prod"
          DOMAIN_KEY="PROD_DOMAIN"

          if [[ "$GITHUB_REF" == "refs/heads/staging" ]]; then
            APP_PROFILE="staging"
            DOMAIN_KEY="STAGING_DOMAIN"
          fi

          SSH_PORT="${SSH_PORT:-22}"
          SERVER="${SERVER_USER}@${SERVER_HOST}"
          APP_DIR="/${LOCATION}"
          APP_JAR="${APP_DIR}/gridflex-backend-service.jar"
          ENV_FILE="${APP_DIR}/.env.gridflex"

          SSH_OPTS=(-o StrictHostKeyChecking=no -p "$SSH_PORT")
          RSYNC_SSH="ssh -o StrictHostKeyChecking=no -p $SSH_PORT"

          echo "Preparing deployment directory..."
          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "mkdir -p '$APP_DIR'"

          # -------------------------------------------------
          # SYSTEMD SETUP
          # Create only when the service is missing.
          # Preserve any existing service configuration.
          # -------------------------------------------------
          echo "Checking systemd service..."

          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "APP_DIR='$APP_DIR' APP_USER='$SERVER_USER' APP_PROFILE='$APP_PROFILE' bash -s" <<'REMOTE'
          set -euo pipefail

          if ! id "$APP_USER" >/dev/null 2>&1; then
            echo "Linux user does not exist: $APP_USER"
            exit 1
          fi

          if ! sudo systemctl cat gridflex >/dev/null 2>&1; then
            echo "gridflex.service not found. Creating it..."

            JAVA_BIN=$(command -v java || true)

            if [ -z "$JAVA_BIN" ]; then
              echo "Java is not installed or is not in PATH."
              exit 1
            fi

            sudo tee /etc/systemd/system/gridflex.service >/dev/null <<UNIT
          [Unit]
          Description=Gridflex Backend Spring Boot Application
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple
          User=$APP_USER
          WorkingDirectory=$APP_DIR
          EnvironmentFile=-$APP_DIR/.env.gridflex
          ExecStart=$JAVA_BIN -Dspring.profiles.active=$APP_PROFILE -jar $APP_DIR/gridflex-backend-service.jar
          Restart=on-failure
          RestartSec=10
          SuccessExitStatus=143

          [Install]
          WantedBy=multi-user.target
          UNIT

            sudo systemctl daemon-reload
          else
            echo "Existing gridflex.service found. Preserving its configuration."
          fi

          sudo systemctl enable gridflex
          REMOTE

          # -------------------------------------------------
          # STOP CURRENT SYSTEMD INSTANCE
          # -------------------------------------------------
          echo "Stopping Gridflex service..."
          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "sudo systemctl stop gridflex || true"

          # -------------------------------------------------
          # UPLOAD JAR
          # -------------------------------------------------
          echo "Uploading Gridflex JAR..."
          rsync -az -e "$RSYNC_SSH" \
            "$JAR_FILE" "$SERVER:$APP_JAR"

          # -------------------------------------------------
          # WRITE ENVIRONMENT FILE
          # -------------------------------------------------
          echo "Writing environment configuration..."

          if [[ "$DOMAIN_KEY" == "STAGING_DOMAIN" ]]; then
            DOMAIN_VALUE="$STAGING_DOMAIN"
          else
            DOMAIN_VALUE="$PROD_DOMAIN"
          fi

          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "umask 077; cat > '$ENV_FILE'" <<EOF
          DB_HOST="$DB_HOST"
          DB_PORT="$DB_PORT"
          DB_NAME="$DB_NAME"
          DB_USERNAME="$DB_USERNAME"
          DB_PASSWORD="$DB_PASSWORD"
          MONGO_HOST="$MONGO_HOST"
          MONGO_PORT="$MONGO_PORT"
          MONGO_DB="$MONGO_DB"
          MONGO_USERNAME="$MONGO_USERNAME"
          MONGO_PASSWORD="$MONGO_PASSWORD"
          HES_PORT="$HES_PORT"
          HES_ADDRESS="$HES_ADDRESS"
          T_ADDRESS="$T_ADDRESS"
          T_PORT="$T_PORT"
          ADMIN_API_VALUE="$ADMIN_API_VALUE"
          USER_API_VALUE="$USER_API_VALUE"
          SETUP_API_VALUE="$SETUP_API_VALUE"
          JWT_SECRET="$JWT_SECRET"
          HEADER_KEY="$HEADER_KEY"
          EUREKA_ADDRESS="$EUREKA_ADDRESS"
          EUREKA_PORT="$EUREKA_PORT"
          BASE_ADDRESS="$BASE_ADDRESS"
          DOC_ADDRESS="$DOC_ADDRESS"
          LOCATION="$LOCATION"
          $DOMAIN_KEY="$DOMAIN_VALUE"
          EOF

          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "chmod 600 '$ENV_FILE'"

          # -------------------------------------------------
          # MIGRATE LEGACY MANUAL JAVA PROCESS IF NECESSARY
          # -------------------------------------------------
          # A newly created systemd unit does not automatically
          # take ownership of an already-running nohup process.
          # Stop any remaining matching Java process gracefully.
          echo "Checking for a legacy Gridflex process..."

          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "APP_JAR='$APP_JAR' bash -s" <<'REMOTE'
          set -euo pipefail

          # systemd should already have stopped its managed process.
          # Only find Java processes running this exact application JAR.
          mapfile -t PIDS < <(
            ps -eo pid=,comm=,args= |
            awk -v jar="$APP_JAR" \
              '$2 == "java" && index($0, jar) > 0 {print $1}'
          )

          for PID in "${PIDS[@]}"; do
            echo "Stopping legacy Gridflex PID $PID gracefully..."
            kill -TERM "$PID" 2>/dev/null || true
          done

          for i in $(seq 1 15); do
            STILL_RUNNING=0

            for PID in "${PIDS[@]}"; do
              if kill -0 "$PID" 2>/dev/null; then
                STILL_RUNNING=1
              fi
            done

            if [ "$STILL_RUNNING" -eq 0 ]; then
              break
            fi

            sleep 1
          done

          # Do not use kill -9. Fail rather than risk killing
          # a process that has not shut down cleanly.
          for PID in "${PIDS[@]}"; do
            if kill -0 "$PID" 2>/dev/null; then
              echo "Legacy process $PID did not stop within 15 seconds."
              exit 1
            fi
          done
          REMOTE

          # -------------------------------------------------
          # START UNDER SYSTEMD
          # -------------------------------------------------
          echo "Starting Gridflex using systemd..."
          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "sudo systemctl start gridflex"

          # -------------------------------------------------
          # VERIFY SERVICE
          # -------------------------------------------------
          echo "Waiting for Gridflex to become active..."

          ssh "${SSH_OPTS[@]}" "$SERVER" 'bash -s' <<'REMOTE'
          set -euo pipefail

          for i in $(seq 1 12); do
            if sudo systemctl is-active --quiet gridflex; then
              echo "Gridflex service is active."
              sudo systemctl is-enabled gridflex
              sudo systemctl show gridflex -p Restart -p RestartUSec
              exit 0
            fi

            sleep 5
          done

          echo "Gridflex failed to become active."
          sudo systemctl status gridflex --no-pager || true
          sudo journalctl -u gridflex -n 100 --no-pager || true
          exit 1
          REMOTE

          echo "Gridflex deployment completed successfully."
  deploy-alfuttaim:

    if: github.ref == 'refs/heads/alfuttaim'

    runs-on: ubuntu-latest

    env:
      APP_NAME: gridflex-backend-service
      SERVICE_NAME: gridflex-backend-service
      DEPLOY_DIR: 'C:\${{ secrets.WIN_LOCATION }}'
      JAR_NAME: gridflex-backend-service.jar
      DELETE_JARS: ${{ secrets.DELETE_JARS }}

    steps:
      #######################################################
      # Checkout Repository
      #######################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      #######################################################
      # Setup Java
      #######################################################
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ==========================
      # Build
      # ==========================
      - name: Build Application
        run: mvn clean package -DskipTests

      #######################################################
      # Locate JAR
      #######################################################
      - name: Locate Executable JAR
        shell: bash
        run: |
          
          JAR=$(find . \
            -type f \
            -path "*/target/*.jar" \
            ! -name "*sources.jar" \
            ! -name "*javadoc.jar" \
            ! -name "*original*.jar" \
            | head -n1)
          
          if [ -z "$JAR" ]; then
            echo "Executable jar not found."
            exit 1
          fi
          
          echo "Found: $JAR"
          
          cp "$JAR" app.jar

      #######################################################
      # Generate WinSW XML
      #######################################################
      - name: Generate WinSW XML
        shell: bash
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          HEADER_KEY: ${{ secrets.HEADER_KEY }}
          ADMIN_API_VALUE: ${{ secrets.ADMIN_API_VALUE }}
          USER_API_VALUE: ${{ secrets.USER_API_VALUE }}
          SETUP_API_VALUE: ${{ secrets.SETUP_API_VALUE }}
        run: |
          xml_escape() {
            printf '%s' "$1" \
              | sed -e 's/&/\&amp;/g' \
                    -e 's/</\&lt;/g' \
                    -e 's/>/\&gt;/g' \
                    -e "s/'/\&apos;/g" \
                    -e 's/"/\&quot;/g'
          }
      
          escape_sed() {
            printf '%s' "$1" | sed 's/[\/&|\\]/\\&/g'
          }
      
          cp deployment/gridflex-backend-service.xml.template gridflex-backend-service.xml

          PROD_DB_PASSWORD_XML=$(xml_escape "${{ secrets.PROD_DB_PASSWORD }}")
          PROD_DB_PASSWORD_XML=$(escape_sed "$PROD_DB_PASSWORD_XML")
          
          JWT_SECRET_ESC=$(xml_escape "${{ secrets.JWT_SECRET }}")
          JWT_SECRET_ESC=$(escape_sed "$JWT_SECRET_ESC")
          
          HEADER_KEY_ESC=$(xml_escape "${{ secrets.HEADER_KEY }}")
          HEADER_KEY_ESC=$(escape_sed "$HEADER_KEY_ESC")
          
          ADMIN_API_VALUE_ESC=$(xml_escape "${{ secrets.ADMIN_API_VALUE }}")
          ADMIN_API_VALUE_ESC=$(escape_sed "$ADMIN_API_VALUE_ESC")
          
          USER_API_VALUE_ESC=$(xml_escape "${{ secrets.USER_API_VALUE }}")
          USER_API_VALUE_ESC=$(escape_sed "$USER_API_VALUE_ESC")
          
          SETUP_API_VALUE_ESC=$(xml_escape "${{ secrets.SETUP_API_VALUE }}")
          SETUP_API_VALUE_ESC=$(escape_sed "$SETUP_API_VALUE_ESC")
        
          
          sed -i "s|\${EUREKA_ADDRESS}|${{ secrets.EUREKA_ADDRESS }}|g" gridflex-backend-service.xml
          sed -i "s|\${EUREKA_PORT}|${{ secrets.EUREKA_PORT }}|g" gridflex-backend-service.xml
          sed -i "s|\${WIN_LOCATION}|C:/${{secrets.WIN_LOCATION}}|g" gridflex-backend-service.xml
          sed -i "s|\${PROD_DB_HOST}|${{ secrets.PROD_DB_HOST }}|g" gridflex-backend-service.xml
          sed -i "s|\${PROD_DB_PORT}|${{ secrets.PROD_DB_PORT }}|g" gridflex-backend-service.xml
          sed -i "s|\${PROD_DB_NAME}|${{ secrets.PROD_DB_NAME }}|g" gridflex-backend-service.xml
          
          sed -i "s|\${PROD_DB_USERNAME}|${{ secrets.PROD_DB_USERNAME }}|g" gridflex-backend-service.xml
          sed -i "s|\${PROD_DB_PASSWORD}|${PROD_DB_PASSWORD_XML}|g" gridflex-backend-service.xml
          sed -i "s|\${PROD_MONGO_HOST}|${{ secrets.PROD_MONGO_HOST }}|g" gridflex-backend-service.xml
       
          sed -i "s|\${PROD_MONGO_PORT}|${{ secrets.PROD_MONGO_PORT }}|g" gridflex-backend-service.xml
          sed -i "s|\${PROD_MONGO_DB}|${{ secrets.PROD_MONGO_DB }}|g" gridflex-backend-service.xml
          sed -i "s|\${PROD_MONGO_USERNAME}|${{ secrets.PROD_MONGO_USERNAME }}|g" gridflex-backend-service.xml
          sed -i "s|\${PROD_MONGO_PASSWORD}|${{ secrets.PROD_MONGO_PASSWORD }}|g" gridflex-backend-service.xml
          
          sed -i "s|\${HES_PORT}|${{ secrets.HES_PORT }}|g" gridflex-backend-service.xml
          sed -i "s|\${PROD_HES_ADDRESS}|${{ secrets.PROD_HES_ADDRESS }}|g" gridflex-backend-service.xml
          sed -i "s|\${WIN_T_ADDRESS}|${{ secrets.WIN_T_ADDRESS }}|g" gridflex-backend-service.xml
          sed -i "s|\${T_PORT}|${{ secrets.T_PORT }}|g" gridflex-backend-service.xml
          sed -i "s|\${ADMIN_API_VALUE}|${ADMIN_API_VALUE_ESC}|g" gridflex-backend-service.xml
          
          sed -i "s|\${USER_API_VALUE}|${USER_API_VALUE_ESC}|g" gridflex-backend-service.xml
          sed -i "s|\${SETUP_API_VALUE}|${SETUP_API_VALUE_ESC}|g" gridflex-backend-service.xml
          sed -i "s|\${JWT_SECRET}|${JWT_SECRET_ESC}|g" gridflex-backend-service.xml
          sed -i "s|\${HEADER_KEY}|${HEADER_KEY_ESC}|g" gridflex-backend-service.xml

          sed -i "s|\${BASE_ADDRESS}|${{ secrets.BASE_ADDRESS }}|g" gridflex-backend-service.xml
          sed -i "s|\${DOC_ADDRESS}|${{ secrets.DOC_ADDRESS }}|g" gridflex-backend-service.xml
          sed -i "s|\${WIN_DOMAIN}|${{ secrets.WIN_DOMAIN }}|g" gridflex-backend-service.xml
          
          echo "Generated WinSW XML:"
          
          cat gridflex-backend-service.xml

      #######################################################
      # Configure SSH
      #######################################################
      - name: Configure SSH
        shell: bash
        run: |
          
          mkdir -p ~/.ssh
          
          echo "${{ secrets.WINDOW_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          
          chmod 600 ~/.ssh/id_rsa
          
          ssh-keyscan ${{ secrets.WINDOW_SERVER_HOST }} >> ~/.ssh/known_hosts

      #######################################################
      # Create Deployment Directory
      #######################################################
      - name: Create Deployment Directory
        run: |
          ssh \
          -i ~/.ssh/id_rsa \
          -o StrictHostKeyChecking=no \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
          "powershell -NoProfile -NonInteractive -" <<'EOF'
          
          $ErrorActionPreference = 'Stop'
          
          New-Item `
          -ItemType Directory `
          -Force `
          -Path 'C:/${{ secrets.WIN_LOCATION }}' | Out-Null
          
          New-Item `
          -ItemType Directory `
          -Force `
          -Path 'C:/${{ secrets.WIN_LOCATION }}/logs' | Out-Null
          
          Write-Host "Deployment directory ready."
          
          EOF

      #######################################################
      # Create data directory
      #######################################################
      - name: Create data folder
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.WINDOW_SERVER_HOST }}
          username: ${{ secrets.WINDOW_SERVER_USER }}
          key: ${{ secrets.WINDOW_SSH_PRIVATE_KEY }}
          script: |
            $dataDir = "C:/${{ secrets.WIN_LOCATION }}/data"
      
            if (!(Test-Path $dataDir)) {
                New-Item -ItemType Directory -Path $dataDir | Out-Null
                Write-Host "Created: $dataDir"
            } else {
                Write-Host "Already exists: $dataDir"
            }

      #######################################################
      # Create upload directory
      #######################################################
      - name: Create upload folder
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.WINDOW_SERVER_HOST }}
          username: ${{ secrets.WINDOW_SERVER_USER }}
          key: ${{ secrets.WINDOW_SSH_PRIVATE_KEY }}
          script: |
            $dataDir = "C:/${{ secrets.WIN_LOCATION }}/uploads"
            
            if (!(Test-Path $dataDir)) {
                New-Item -ItemType Directory -Path $dataDir | Out-Null
                Write-Host "Created: $dataDir"
            } else {
                Write-Host "Already exists: $dataDir"
            }
            
      #######################################################
      # Upload WinSW Wrapper
      #######################################################
      - name: Upload WinSW Wrapper
        run: |
          
          ssh \
          -i ~/.ssh/id_rsa \
          -o StrictHostKeyChecking=no \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
          "powershell -NoProfile -NonInteractive -" <<'EOF'
          
          if (Test-Path 'C:/${{ secrets.WIN_LOCATION }}/gridflex-backend-service.exe') {
          
           Write-Host "WinSW wrapper already exists."
           Write-Host "Skipping wrapper upload."
          
           exit 0
          }
          
          Write-Host "WinSW wrapper does not exist."
          Write-Host "Wrapper will be uploaded."
          
          EOF
          
          WRAPPER_EXISTS=$(ssh \
          -i ~/.ssh/id_rsa \
          -o StrictHostKeyChecking=no \
          ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
          "powershell -NoProfile -NonInteractive -Command \"if (Test-Path 'C:/${{ secrets.WIN_LOCATION }}/gridflex-backend-service.exe') { exit 0 } else { exit 1 }\"" \
          >/dev/null 2>&1 && echo "yes" || echo "no")
          
          if [ "$WRAPPER_EXISTS" = "no" ]; then

          echo "Uploading gridflex-backend-service.exe..."

          scp \
           -i ~/.ssh/id_rsa \
           -o StrictHostKeyChecking=no \
           -o ServerAliveInterval=30 \
           -o ServerAliveCountMax=10 \
           deployment/gridflex-backend-service.exe \
           "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}:/C:/${{ secrets.WIN_LOCATION }}/gridflex-backend-service.exe"
          
          else

          echo "gridflex-backend-service.exe already exists. Upload skipped."
          
          fi


      #######################################################
      # Stop WinSW Service
      #######################################################
      - name: Stop Windows Service
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'
          
          $ErrorActionPreference = 'Stop'
          
          $service = Get-Service -Name 'gridflex-backend-service' -ErrorAction Stop
          
          if ($null -eq $service) {

            Write-Host "gridflex-backend-service does not exist yet."
            Write-Host "Skipping stop. Service will be installed later."

            exit 0
          }
          
          Write-Host "Current Status: $($service.Status)"
          
          if ($service.Status -eq 'Running') {
          
              Write-Host "Stopping service..."
          
              Stop-Service -Name 'gridflex-backend-service'
          
              $service.WaitForStatus(
                  'Stopped',
                  '00:00:30'
              )
          
          }
          
          $service = Get-Service -Name 'gridflex-backend-service'
          
          if ($service.Status -ne 'Stopped') {
          
              throw "Failed to stop service."
          
          }
          
          Write-Host "Service stopped successfully."
          
          EOF

      #######################################################
      # Optional: Delete Existing JAR and Backup
      #######################################################
      - name: Delete Existing JAR and Backup
        if: env.DELETE_JARS == 'true'
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'
          
          $ErrorActionPreference = 'Stop'
          
          $files = @(
              "C:/${{ secrets.WIN_LOCATION }}/gridflex-backend-service.jar",
              "C:/${{ secrets.WIN_LOCATION }}/gridflex-backend-service.jar.bak"
          )
          
          foreach ($file in $files) {
              if (Test-Path $file) {
                  Remove-Item $file -Force
                  Write-Host "Deleted: $file"
              }
              else {
                  Write-Host "Not found: $file"
              }
          }
          
          EOF

      #######################################################
      # Backup Existing JAR
      #######################################################
      - name: Backup Existing JAR
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'
          
          $ErrorActionPreference='Stop'
          
          $jar="C:/${{ secrets.WIN_LOCATION }}/gridflex-backend-service.jar"
          
          $backup="C:/${{ secrets.WIN_LOCATION }}/gridflex-backend-service.jar.bak"
          
          if(Test-Path $jar){
          
              Copy-Item `
                  $jar `
                  $backup `
                  -Force
          
              Write-Host "Backup completed."
          
          }
          else{
          
              Write-Host "No existing JAR. Backup skipped."

          }
          
          EOF

      #######################################################
      # Upload New JAR
      #######################################################
      - name: Upload Application
        run: |
          
          scp \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            app.jar \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}:/C:/${{secrets.WIN_LOCATION}}/gridflex-backend-service.jar"

      #######################################################
      # Upload WinSW XML
      #######################################################
      - name: Upload WinSW XML
        run: |
          scp \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            gridflex-backend-service.xml \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}:/C:/${{secrets.WIN_LOCATION}}/gridflex-backend-service.xml"


      #######################################################
      # Install WinSW Service If Missing
      #######################################################
      - name: Install WinSW Service If Missing
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'
          
          $ErrorActionPreference = 'Stop'
          
          $serviceName = 'gridflex-backend-service'
          
          $base = 'C:/${{ secrets.WIN_LOCATION }}'
          
          $wrapper = "$base/gridflex-backend-service.exe"
          
          $config = "$base/gridflex-backend-service.xml"
          
          $service = Get-Service `
            -Name $serviceName `
            -ErrorAction SilentlyContinue
          
          if ($null -eq $service) {
          
              Write-Host ""
              Write-Host "============================================"
              Write-Host "Installing WinSW Service"
              Write-Host "============================================"
          
              if (!(Test-Path -LiteralPath $wrapper -PathType Leaf)) {
                  throw "WinSW wrapper not found: $wrapper"
              }
          
              if (!(Test-Path -LiteralPath $config -PathType Leaf)) {
                  throw "WinSW configuration not found: $config"
              }
          
              Write-Host "Wrapper: $wrapper"
              Write-Host "Config:  $config"
          
              Push-Location $base
          
              try {
          
                  & $wrapper install
          
                  if ($LASTEXITCODE -ne 0) {
                      throw "WinSW service installation failed."
                  }
          
              }
              finally {
          
                  Pop-Location
              }
          
              Write-Host "WinSW service installed successfully."
          
          }
          else {
          
              Write-Host ""
              Write-Host "gridflex-backend-service already exists."
              Write-Host "Skipping WinSW installation."
          
          }
          
          EOF
      
      #######################################################
      # Verify Uploaded Files
      #######################################################
      - name: Verify Upload
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'
          
              $files = @(
                  'C:/${{ secrets.WIN_LOCATION }}/gridflex-backend-service.exe',
                  'C:/${{ secrets.WIN_LOCATION }}/gridflex-backend-service.jar',
                  'C:/${{ secrets.WIN_LOCATION }}/gridflex-backend-service.xml'
              )
          
              foreach($file in $files){
          
                  if(!(Test-Path $file)){
                      throw "Missing: $file"
                  }
          
                  Write-Host "Verified: $file"
          
              }
          
              Get-ChildItem C:\${{ secrets.WIN_LOCATION }}
          
            END

      #######################################################
      # Start Windows Service
      #######################################################
      - name: Start Windows Service
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'
          
          $ErrorActionPreference='Stop'
          
          Write-Host "Starting gridflex-backend-service..."
          
          Start-Service -Name "gridflex-backend-service"
          
          Start-Sleep -Seconds 5
          
          $service = Get-Service -Name "gridflex-backend-service"
          
          $service.WaitForStatus(
              "Running",
              "00:00:30"
          )
          
          $service = Get-Service -Name "gridflex-backend-service"
          
          if($service.Status -ne "Running"){
          
              throw "Service failed to start."
          
          }
          
          Write-Host "Service started successfully."
          
          EOF

      #######################################################
      # Verify Java Process
      #######################################################
      - name: Verify Java Process
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'
          
          $ErrorActionPreference='Stop'
          
          $java = Get-CimInstance Win32_Process |
          Where-Object {
          
              $_.Name -eq "java.exe" -and
              $_.CommandLine -like "*gridflex-backend-service.jar*"
          
          }
          
          if(!$java){
          
              throw "Java process not running."
          
          }
          
          Write-Host "Java PID: $($java.ProcessId)"
          
          EOF

      #######################################################
      # Verify Deployment
      #######################################################
      - name: Verify Deployment
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            powershell -Command "
          
            Write-Host ''
          
            Write-Host '========== SERVICE =========='
          
            Get-Service gridflex-backend-service
          
            Write-Host ''
          
            Write-Host '========== FILES =========='
          
            Get-ChildItem C:/${{ secrets.WIN_LOCATION}}
          
            Write-Host ''
          
            Write-Host '========== LOGS =========='
          
            Get-ChildItem C:/${{ secrets.WIN_LOCATION }}/logs -ErrorAction SilentlyContinue
          
            "
      #######################################################
      # Display Logs On Failure
      #######################################################
      - name: Display Logs
        if: failure()
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            powershell -Command "
          
            Write-Host ''
            Write-Host '========== WinSW OUT =========='
          
            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/gridflex-backend-service.out.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/gridflex-backend-service.out.log' -Tail 100
            }
          
            Write-Host ''
            Write-Host '========== WinSW ERR =========='
          
            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/gridflex-backend-service.err.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/gridflex-backend-service.err.log' -Tail 100
            }
          
            Write-Host ''
            Write-Host '========== WRAPPER LOG =========='
          
            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/wrapper.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/wrapper.log' -Tail 100
            }
          
            Write-Host ''
            Write-Host '========== SPRING LOG =========='
          
            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/logs/gridflex.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/logs/gridflex.log' -Tail 100
            }
          
            Write-Host ''
            Write-Host '========== GC LOG =========='
          
            if(Test-Path 'C:/${{ secrets.WIN_LOCATION }}/logs/gc.log'){
                Get-Content 'C:/${{ secrets.WIN_LOCATION }}/logs/gc.log' -Tail 100
            }
          
            "





